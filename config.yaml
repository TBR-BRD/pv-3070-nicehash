application:
  name: pv-3070-nicehash
  version: "1.0.0"
  log_level: INFO
  poll_interval_seconds: 10
  dry_run: true

pv:
  shelly_ip: "192.168.1.50"
  reserve_watts: 40
  # Winter operation: PV surplus alone rarely reaches the old 180W/110W
  # thresholds, so these allow mining to run on a mix of surplus and grid
  # power - up to 100W pulled from the grid before stopping (negative
  # values are grid import, positive are export, same sign convention as
  # the read-back surplus value itself).
  start_threshold_watts: -30
  stop_threshold_watts: -100
  min_start_seconds: 180
  # 20 min: a brief deficit (a cloud, the EV charger cycling) shouldn't stop
  # mining - up to ~100W of grid import during that window is an accepted
  # cost of not flapping start/stop every few minutes.
  min_stop_seconds: 1200
  invert_power_sign: false
  request_timeout_seconds: 5
  # Exponential-moving-average time constant (seconds) applied to the raw
  # Shelly reading before it drives start/stop decisions and the GPU power
  # target - damps short-lived noise (a fridge cycling, inverter jitter, a
  # cloud edge) that would otherwise yank the GPU power limit around every
  # poll_interval_seconds. 0 disables smoothing (use the raw reading as-is).
  surplus_smoothing_seconds: 60

gpu:
  index: 0
  min_power_watts: 100
  max_power_watts: 180
  safe_power_watts: 100
  power_step_watts: 10
  temperature_warning_c: 75
  temperature_critical_c: 80
  error_limit: 3
  # Minimum change (watts) between the currently-applied power limit and a
  # newly computed target before it's actually re-applied via nvidia-smi -
  # the other half of the anti-jitter fix alongside surplus_smoothing_seconds.
  power_change_deadband_watts: 20

nicehash:
  executable: "C:\\NiceHashMiner\\NiceHashMiner.exe"
  working_directory: "C:\\NiceHashMiner"
  process_name: "NiceHashMiner.exe"
  startup_timeout_seconds: 30
  stop_timeout_seconds: 20

logging:
  file: "logs/pv-3070-nicehash.log"

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 8090

nicehash_cloud:
  enabled: false
  worker_name: "windows10pc"
  poll_interval_seconds: 60

pc_power_meter:
  enabled: false
  shelly_ip: "192.168.178.180"
  poll_interval_seconds: 10

auto_shutdown:
  enabled: true
  # Off by default: shutting the whole PC down just because there's no
  # usable surplus right now means a temporary big grid draw elsewhere in
  # the house (an EV charging at several kW, say) can look identical to
  # "no surplus for idle_minutes" and take the PC down for the rest of the
  # day - only the hard_deadline_hour below then still applies. Turn this
  # back on (true) for the old behavior of shutting down early on a quiet day.
  idle_shutdown_enabled: false
  idle_minutes: 30
  not_before_hour: 17
  # Hard deadline, independent of the idle check above: the PC is shut down
  # at this hour no matter what (even mid-MINING) - winter days end early
  # and the PC shouldn't still be mining/awake into the evening.
  hard_deadline_hour: 19
